name: Build S.A DOORS APK

on:
  workflow_dispatch:
  push:
    paths:
      - "sa-doors-billing-project.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o sa-doors-billing-project.zip -d project
          cp -r project/FlushDoorPrivateAPKProject/. . 2>/dev/null || cp -r project/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-DOORS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
