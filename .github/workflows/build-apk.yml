
name: Build S.A DOORS APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SA-DOORS-Corrected-Source.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract new S.A DOORS source
        run: |
          mkdir -p extracted
          unzip -o SA-DOORS-Corrected-Source.zip -d extracted

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle settings file found in ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Build APK
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" -p "$PROJECT_DIR" assembleDebug
          else
            gradle -p "$PROJECT_DIR" assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-DOORS-UPDATED-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
