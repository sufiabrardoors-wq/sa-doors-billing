
name: Build S.A DOORS APK

on:
  workflow_dispatch:
  push:
    paths:
      - "sa-doors-business-app-project.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o sa-doors-business-app-project.zip -d extracted
          echo "Extracted project files:"
          find extracted -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \)

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle settings file found in ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"
         
      - name: Diagnose build files
        run: |
          echo "Project directory: $PROJECT_DIR"
          echo "Project files:"
          ls -la "$PROJECT_DIR"
          echo "Gradle files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle-wrapper.properties" \)
          echo "App folder:"
          ls -la "$PROJECT_DIR/app" || true
     
      - name: Build APK
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" -p "$PROJECT_DIR" assembleDebug
          else
            gradle -p "$PROJECT_DIR" assembleDebug
          fi
          
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-DOORS-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
